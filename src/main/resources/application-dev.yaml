spring:
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bwMarcenaria?serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

integracoes:
  google:
    calendar:
      # Ambiente local usa HTTP, então o cookie Secure precisa ficar desligado
      # para o navegador conseguir enviá-lo de volta no callback do OAuth.
      cookie-secure: ${GOOGLE_OAUTH_COOKIE_SECURE:false}

logging:
  level:
    root: INFO
    br.com.bw.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE