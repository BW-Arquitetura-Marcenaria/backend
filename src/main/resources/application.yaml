spring:
  application:
    name: backend

  profiles:
    default: dev

  flyway:
    enabled: true
    validate-migration-naming: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    br.com.bw.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

app:
  integracao:
    api-key: ${INTEGRACAO_API_KEY}
  cadastro:
    base-url: ${APP_BASE_URL:http://localhost:3000}
    token-validade-horas: 48
  convite-admin:
    base-url: ${APP_BASE_URL:http://localhost:8443}
    expiracao-horas: 48
  mail:
    from: ${MAIL_FROM}
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: 30