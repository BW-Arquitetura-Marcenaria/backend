spring:
  application:
    name: backend

  profiles:
    default: dev

  flyway:
    enabled: true
    validate-migration-naming: true
    locations: classpath:db/migration

integracoes:
  google:
    calendar:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
      scope: https://www.googleapis.com/auth/calendar
      encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY}
      cookie-secure: ${GOOGLE_OAUTH_COOKIE_SECURE:true}
      calendar-id: ${GOOGLE_CALENDAR_ID:primary}
      timezone: ${GOOGLE_CALENDAR_TIMEZONE:America/Sao_Paulo}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    br.com.bw.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

app:
  integracao:
    api-key: ${INTEGRACAO_API_KEY}
  cadastro:
    base-url: ${APP_BASE_URL:http://localhost:3000}
    token-validade-horas: 48
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: 30