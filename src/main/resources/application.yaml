spring:
  application:
    name: backend

  profiles:
    default: dev

  flyway:
    enabled: true
    validate-migration-naming: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    br.com.bw.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

app:
  integracao:
    api-key: ${INTEGRACAO_API_KEY}
  cadastro:
    base-url: ${APP_BASE_URL:http://localhost:3000}
    token-validade-horas: 48
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: 30