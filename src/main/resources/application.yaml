spring:
  application:
    name: backend

  profiles:
    default: dev

  flyway:
    enabled: true
    validate-migration-naming: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

app:
  integracao:
    api-key: ${INTEGRACAO_API_KEY}
  cadastro:
    base-url: ${APP_BASE_URL:http://localhost:3000}
    token-validade-horas: 48